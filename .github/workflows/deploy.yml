name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [be, ws, fe]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check required build secrets
        if: matrix.service == 'fe'
        env:
          API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$WS_URL" ]; then
            echo "::error::NEXT_PUBLIC_API_URL and NEXT_PUBLIC_WS_URL must be set as repo secrets"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/matiks-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/matiks-${{ matrix.service }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: mkdir -p ~/Matiks/docker

      - name: Copy compose file and Caddyfile
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: docker-compose.prod.yml
          target: Matiks

      - name: Copy Caddyfile
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: docker/Caddyfile
          target: Matiks/docker

      - name: Write .env, pull images and restart
        uses: appleboy/ssh-action@v1
        env:
          TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          APP_HOST: ${{ secrets.APP_HOST }}
          JWTTOKEN: ${{ secrets.JWTTOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,APP_HOST,JWTTOKEN,POSTGRES_PASSWORD
          script: |
            set -e
            cd ~/Matiks
            umask 077
            {
              printf 'TAG=%s\n' "$TAG"
              printf 'DOCKERHUB_USERNAME=%s\n' "$DOCKERHUB_USERNAME"
              printf 'APP_HOST=%s\n' "$APP_HOST"
              printf 'JWTTOKEN=%s\n' "$JWTTOKEN"
              printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            } > .env
            chmod 600 .env
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
