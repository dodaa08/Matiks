services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: matiks
      POSTGRES_PASSWORD: matiks
      POSTGRES_DB: matiks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matiks -d matiks"]
      interval: 5s
      timeout: 5s
      retries: 10

  be:
    build:
      context: .
      dockerfile: docker/Dockerfile.be
    environment:
      DATABASE_URL: postgresql://matiks:matiks@postgres:5432/matiks
      JWTTOKEN: ${JWTTOKEN:?set JWTTOKEN in your shell or .env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ws:
    build:
      context: .
      dockerfile: docker/Dockerfile.ws
    environment:
      DATABASE_URL: postgresql://matiks:matiks@postgres:5432/matiks
      JWTTOKEN: ${JWTTOKEN:?set JWTTOKEN in your shell or .env}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  fe:
    build:
      context: .
      dockerfile: docker/Dockerfile.fe
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_WS_URL: ws://localhost:8081
    environment:
      API_INTERNAL_URL: http://be:8080
    ports:
      - "3000:3000"
    depends_on:
      - be
      - ws

volumes:
  pgdata:
